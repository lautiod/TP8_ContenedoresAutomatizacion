trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  projectPath: 'EmployeeCrudAngular'
  backendProject: 'EmployeeCrudApi/EmployeeCrudApi/EmployeeCrudApi.csproj'

  # WebApps en Azure
  webAppApiName: 'BackQA'
  webAppFrontName: 'FrontQA'

  # Conexiones de servicio
  sonarCloudServiceConnection: 'SonarCloud'
  azureServiceConnection: 'ISW3_ServiceConnection'

  artifactStagingDir: '$(Build.ArtifactStagingDirectory)'

stages:
# =============================
# 1️⃣ Build, Tests y SonarCloud
# =============================
  - stage: BuildAndQA
    displayName: "Build, Unit Tests, Code Coverage y SonarCloud"
    jobs:
      # ---- Backend (.NET) ----
      - job: Backend
        displayName: "Backend (.NET)"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - script: |
              echo "=== DEBUG: Verificando csproj real ==="
              find "$BUILD_SOURCESDIRECTORY" -maxdepth 4 -name '*.csproj'
            displayName: 'DEBUG: Listar .csproj'

          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '8.0.x'
            displayName: 'Instalar .NET SDK 8'

          - script: |
              dotnet restore "$(backendProject)"
            displayName: 'dotnet restore (Backend)'

          - task: SonarCloudPrepare@2
            inputs:
              SonarCloud: '$(sonarCloudServiceConnection)'
              organization: 'santiagotricherri'
              scannerMode: 'MSBuild'
              projectKey: 'santiagotricherri_TP7-IngSw3'
              projectName: 'TP7-IngSw3'
            displayName: 'Prepare SonarCloud (.NET)'

          - script: |
              dotnet build "$(backendProject)" -c Release --no-restore
            displayName: 'dotnet build (Backend)'

          - task: DotNetCoreCLI@2
            displayName: 'Ejecutar pruebas unitarias (.NET)'
            inputs:
              command: 'test'
              projects: '**/*.Tests.csproj'
              arguments: '--collect:"XPlat Code Coverage" --logger trx'

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '**/*.trx'
            condition: always()
            displayName: 'Publicar resultados de pruebas (.NET)'

          - script: |
              echo "Generando reporte Cobertura (.NET)..."
              dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.* || true
              export PATH="$PATH:~/.dotnet/tools"
              REPORT=$(find . -type f -name 'coverage.cobertura.xml' -o -name 'coverage.opencover.xml' | head -1)
              if [ -n "$REPORT" ]; then
                reportgenerator -reports:$REPORT -targetdir:$(artifactStagingDir)/coverage-report -reporttypes:Cobertura
              else
                echo "No se encontró coverage report"
              fi
            displayName: 'Generar reporte Cobertura (.NET)'

          - task: PublishCodeCoverageResults@2
            inputs:
              summaryFileLocation: '$(artifactStagingDir)/coverage-report/Cobertura.xml'
              failIfCoverageEmpty: false
            condition: always()
            displayName: 'Publicar Code Coverage (.NET)'

          - task: SonarCloudAnalyze@2
            displayName: 'SonarCloud Analyze (.NET)'

          - task: SonarCloudPublish@2
            inputs:
              pollingTimeoutSec: '300'
            displayName: 'SonarCloud Publish (.NET)'

          - script: |
              dotnet publish "$(backendProject)" -c Release -o $(artifactStagingDir)/api
            displayName: 'dotnet publish (Backend)'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(artifactStagingDir)/api'
              artifact: 'api-artifact'
            displayName: 'Publish backend artifact'

      # ---- Frontend (Angular) ----
      - job: Frontend
        displayName: "Frontend (Angular)"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          # ✅ Node 18.18.x para compatibilidad Cypress/Angular
          - task: NodeTool@0
            inputs:
              versionSpec: '18.18.x'
            displayName: 'Instalar Node.js 18.18.x'

          # Instalar dependencias
          - script: |
              cd $(projectPath)
              npm ci
            displayName: 'Instalar dependencias (Front)'

          # Ejecutar tests y generar cobertura
          - script: |
              cd $(projectPath)
              npx ng test --watch=false --browsers ChromeHeadless --code-coverage --reporters=junit || true
            displayName: 'Ejecutar pruebas unitarias (Angular)'

          # DEBUG: buscar archivo de cobertura real
          - script: |
              echo "=== DEBUG: Buscando archivo lcov.info generado ==="
              find $(projectPath)/coverage -type f -name "lcov.info" || echo "No se encontró archivo de cobertura"
            displayName: 'DEBUG: Buscar lcov.info'

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(projectPath)/coverage/**/test-results.xml'
              failTaskOnFailedTests: false
            condition: always()
            displayName: 'Publicar resultados pruebas (Angular)'

          # Publicar cobertura (aunque no esté en la raíz)
          - task: PublishCodeCoverageResults@2
            inputs:
              summaryFileLocation: '$(projectPath)/coverage/**/lcov.info'
              reportDirectory: '$(projectPath)/coverage'
              failIfCoverageEmpty: false
            condition: always()
            displayName: 'Publicar Code Coverage (Angular)'

          # Preparar análisis SonarCloud
          - task: SonarCloudPrepare@2
            inputs:
              SonarCloud: '$(sonarCloudServiceConnection)'
              organization: 'santiagotricherri'
              scannerMode: 'CLI'
              configMode: 'manual'
              cliProjectKey: 'santiagotricherri_TP7-IngSw3-Front'
              cliProjectName: 'TP7-IngSw3-Front'
              extraProperties: |
                sonar.projectBaseDir=$(System.DefaultWorkingDirectory)/$(projectPath)
                sonar.sources=src
                sonar.javascript.lcov.reportPaths=$(System.DefaultWorkingDirectory)/$(projectPath)/coverage/**/lcov.info
                sonar.sourceEncoding=UTF-8
            displayName: 'Prepare SonarCloud (Angular)'

          - task: SonarCloudAnalyze@2
            displayName: 'SonarCloud Analyze (Angular)'

          - task: SonarCloudPublish@2
            inputs:
              pollingTimeoutSec: '300'
            displayName: 'SonarCloud Publish (Angular)'

          # Build de producción
          - script: |
              cd $(projectPath)
              npx ng build --configuration production --output-path=$(Build.ArtifactStagingDirectory)/dist
            displayName: 'ng build (production)'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/dist'
              artifact: 'front-artifact'
            displayName: 'Publish frontend artifact'

# =============================
# 2️⃣ Deploy + Integration Tests
# =============================
  - stage: DeployAndIntegration
    displayName: "Deploy a QA y Pruebas de Integración"
    dependsOn: BuildAndQA
    condition: succeeded()

    jobs:
      - job: Deploy
        displayName: "Deploy Front y Back a QA"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: 'api-artifact'
              path: '$(Pipeline.Workspace)/api'
            displayName: 'Descargar backend artifact'

          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: 'front-artifact'
              path: '$(Pipeline.Workspace)/front'
            displayName: 'Descargar frontend artifact'

          - task: AzureWebApp@1
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appName: '$(webAppApiName)'
              package: '$(Pipeline.Workspace)/api'
            displayName: 'Deploy API a Azure WebApp'

          - task: AzureWebApp@1
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appName: '$(webAppFrontName)'
              package: '$(Pipeline.Workspace)/front'
            displayName: 'Deploy Front a Azure WebApp'

      - job: IntegrationTests
        displayName: "Pruebas de Integración (Cypress)"
        dependsOn: Deploy
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          # ✅ Node 18.18.x también acá (Cypress)
          - task: NodeTool@0
            inputs:
              versionSpec: '18.18.x'
            displayName: 'Instalar Node.js 18.18.x'

          - script: |
              cd $(projectPath)
              npm ci
            displayName: 'Instalar dependencias Cypress'

          # Descargar artefacto frontend para servirlo localmente en las pruebas
          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: 'front-artifact'
              path: '$(System.DefaultWorkingDirectory)/$(projectPath)/dist'
            displayName: 'Download frontend artifact for Cypress'

          # 🧩 Nuevo: levantar front en background antes de Cypress
          - script: |
              echo "Contents of $(System.DefaultWorkingDirectory)/$(projectPath)/dist:" 
              ls -la "$(System.DefaultWorkingDirectory)/$(projectPath)/dist" || true
              cd "$(System.DefaultWorkingDirectory)/$(projectPath)/dist"
              npx http-server . -p 4200 &
              sleep 5
            displayName: 'Levantar servidor Angular para Cypress (http://localhost:4200)'

          # Ejecutar Cypress apuntando al front local
          - script: |
              cd $(projectPath)
              # Ensure TERM is set so tput doesn't error in headless CI
              export TERM=xterm-256color
              echo "WEBAPP_QA_FRONTEND_URL='$WEBAPP_QA_FRONTEND_URL'"
              # Prefer explicit URL, else try to build from app name, else fallback to local dist
              if [ -n "$WEBAPP_QA_FRONTEND_URL" ]; then
                FRONT_URL="$WEBAPP_QA_FRONTEND_URL"
                echo "Running Cypress against deployed frontend (explicit): $FRONT_URL"
              elif [ -n "$WEBAPP_QA_FRONTEND" ]; then
                FRONT_URL="https://${WEBAPP_QA_FRONTEND}.azurewebsites.net"
                echo "Running Cypress against deployed frontend (constructed): $FRONT_URL"
              else
                FRONT_URL="http://localhost:4200"
                echo "No deployed frontend info found; will run against local dist: $FRONT_URL"
              fi
              npx cypress run --config baseUrl=$FRONT_URL --env environment=qa --reporter junit --reporter-options "mochaFile=cypress/results/results-[hash].xml"
            displayName: 'Ejecutar pruebas Cypress'
            continueOnError: true

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(projectPath)/cypress/results/*.xml'
            condition: always()
            displayName: 'Publicar resultados Cypress'

          # ✅ Publicar videos/screenshots solo si existen
          - script: |
              echo "Checking for Cypress videos folder"
              if [ -d "$(System.DefaultWorkingDirectory)/$(projectPath)/cypress/videos" ]; then
                echo "##vso[task.setvariable variable=CYPRESS_VIDEOS_EXISTS]true"
                echo "Found videos"
              else
                echo "No videos found"
              fi
            displayName: 'Detectar videos Cypress'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(projectPath)/cypress/videos'
              artifact: 'cypress-videos'
            condition: and(always(), eq(variables.CYPRESS_VIDEOS_EXISTS, 'true'))
            displayName: 'Publicar videos Cypress'

          - script: |
              echo "Checking for Cypress screenshots folder"
              if [ -d "$(System.DefaultWorkingDirectory)/$(projectPath)/cypress/screenshots" ]; then
                echo "##vso[task.setvariable variable=CYPRESS_SCREENSHOTS_EXISTS]true"
                echo "Found screenshots"
              else
                echo "No screenshots found"
              fi
            displayName: 'Detectar screenshots Cypress'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(projectPath)/cypress/screenshots'
              artifact: 'cypress-screenshots'
            condition: and(always(), eq(variables.CYPRESS_SCREENSHOTS_EXISTS, 'true'))
            displayName: 'Publicar screenshots Cypress'
