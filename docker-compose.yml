version: "3.9"

services:
  sqlserver:
    # Compatible con Intel y Apple Silicon
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: tp6-sql
    environment:
      - ACCEPT_EULA=1
      - MSSQL_SA_PASSWORD=${SA_PASSWORD:-YourStrong!Passw0rd}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      - sqlserver
    environment:
      - SA_PASSWORD=${SA_PASSWORD:-YourStrong!Passw0rd}
    volumes:
      - ./docker/sql/init.sql:/init/init.sql:ro
      - ./docker/sql/team_seed.sql:/init/team_seed.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "until /opt/mssql-tools/bin/sqlcmd -S sqlserver -U SA -P $${SA_PASSWORD} -Q 'SELECT 1' > /dev/null 2>&1; do echo 'Waiting for SQL Server...' && sleep 2; done;
      /opt/mssql-tools/bin/sqlcmd -S sqlserver -U SA -P $${SA_PASSWORD} -Q \"IF DB_ID('TestDB') IS NULL CREATE DATABASE TestDB;\" &&
      /opt/mssql-tools/bin/sqlcmd -S sqlserver -U SA -P $${SA_PASSWORD} -d TestDB -i /init/init.sql &&
      if [ -f /init/team_seed.sql ]; then echo 'Applying team seed...' && /opt/mssql-tools/bin/sqlcmd -S sqlserver -U SA -P $${SA_PASSWORD} -d TestDB -i /init/team_seed.sql; else echo 'No team seed found (docker/sql/team_seed.sql). Skipping.'; fi"

volumes:
  mssql-data:
