trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

variables:
- group: TP8_Variables
- name: projectPath
  value: 'EmployeeCrudAngular'


stages:
# =======================================
# ✅ TESTS (respeta tus unit tests)
# =======================================
- stage: Tests
  displayName: 'Run Unit Tests (FE + BE)'
  jobs:
    # ---- Frontend (Angular) Unit Tests ----
    - job: TestFrontend
      displayName: 'Angular Unit Tests (ChromeHeadless)'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - checkout: self

        # ✅ Node 18.18.x for compatibility
        - task: NodeTool@0
          inputs:
            versionSpec: '18.18.x'
          displayName: 'Instalar Node.js 18.18.x'

        # Instalar dependencias
        - script: |
            cd $(projectPath)
            npm ci
            npm install -D karma-junit-reporter
          displayName: 'Instalar dependencias (Front)'

        # Ejecutar tests y generar cobertura
        - script: |
            cd $(projectPath)
            echo "Ejecutando todos los tests..."
            npx ng test --no-watch --no-progress --browsers ChromeHeadless --code-coverage --karma-config karma.conf.js
          displayName: 'Ejecutar pruebas unitarias (Angular)'
          continueOnError: false

        # Publicar resultados de pruebas
        - task: PublishTestResults@2
          inputs:
            testResultsFormat: 'JUnit'
            testResultsFiles: '$(projectPath)/test-results/**/test-results.xml'
            failTaskOnFailedTests: false
          condition: always()
          displayName: 'Publicar resultados pruebas (Angular)'

        # Publicar artefacto de cobertura Angular para el job de consolidación
        - task: PublishPipelineArtifact@1
          inputs:
            targetPath: '$(projectPath)/coverage'
            artifact: 'frontend-coverage'
            publishLocation: 'pipeline'
          condition: always()
          displayName: 'Publicar artefacto de cobertura (Angular)'

    # ---- Backend (.NET) Unit Tests ----
    - job: TestBackend
      displayName: '.NET Unit Tests'
      steps:
        - checkout: self
        - task: UseDotNet@2
          inputs:
            packageType: 'sdk'
            version: '8.0.x'

        - task: DotNetCoreCLI@2
          displayName: 'Ejecutar pruebas de la API'
          inputs:
            command: 'test'
            projects: '**/*.Tests.csproj'
            arguments: '--collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura'

        # Publicar artefacto de cobertura .NET para el job de consolidación
        - task: PublishPipelineArtifact@1
          inputs:
            targetPath: '$(Agent.TempDirectory)'
            artifact: 'backend-coverage'
            publishLocation: 'pipeline'
          condition: always()
          displayName: 'Publicar artefacto de cobertura (.NET)'

    # ---- Consolidar Code Coverage ----
    - job: PublishCoverage
      displayName: 'Publicar Code Coverage Consolidado'
      dependsOn:
        - TestFrontend
        - TestBackend
      condition: always()
      steps:
        # Descargar artefactos de cobertura
        - task: DownloadPipelineArtifact@2
          inputs:
            artifact: 'frontend-coverage'
            path: '$(Pipeline.Workspace)/frontend-coverage'
          displayName: 'Descargar cobertura Frontend'
          continueOnError: true

        - task: DownloadPipelineArtifact@2
          inputs:
            artifact: 'backend-coverage'
            path: '$(Pipeline.Workspace)/backend-coverage'
          displayName: 'Descargar cobertura Backend'
          continueOnError: true

        # Debug: Listar archivos descargados
        - script: |
            echo "=== Frontend Coverage Files ==="
            dir "$(Pipeline.Workspace)\frontend-coverage" /s /b
            echo "=== Backend Coverage Files ==="
            dir "$(Pipeline.Workspace)\backend-coverage" /s /b
          displayName: 'DEBUG: Listar archivos de cobertura'
          condition: always()

        # Preparar archivos de cobertura en una ubicación limpia
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: |
              # Crear directorio para archivos consolidados
              $mergedDir = "$(Pipeline.Workspace)\merged-coverage"
              New-Item -ItemType Directory -Force -Path $mergedDir
              
              # Buscar y copiar archivo de cobertura del Frontend
              $frontendCoverage = Get-ChildItem -Path "$(Pipeline.Workspace)\frontend-coverage" -Filter "cobertura-coverage.xml" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($frontendCoverage) {
                Write-Host "✅ Frontend coverage encontrado: $($frontendCoverage.FullName)"
                Copy-Item -Path $frontendCoverage.FullName -Destination "$mergedDir\frontend-cobertura.xml"
              } else {
                Write-Host "##[warning]❌ No se encontró archivo de cobertura del Frontend"
              }
              
              # Buscar y copiar archivo de cobertura del Backend
              $backendCoverage = Get-ChildItem -Path "$(Pipeline.Workspace)\backend-coverage" -Filter "coverage.cobertura.xml" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($backendCoverage) {
                Write-Host "✅ Backend coverage encontrado: $($backendCoverage.FullName)"
                Copy-Item -Path $backendCoverage.FullName -Destination "$mergedDir\backend-cobertura.xml"
              } else {
                Write-Host "##[warning]❌ No se encontró archivo de cobertura del Backend"
              }
              
              # Listar archivos consolidados
              Write-Host "=== Archivos consolidados ==="
              Get-ChildItem -Path $mergedDir
          displayName: 'Preparar archivos de cobertura'
          condition: always()

        # Instalar ReportGenerator
        - task: DotNetCoreCLI@2
          inputs:
            command: 'custom'
            custom: 'tool'
            arguments: 'install --global dotnet-reportgenerator-globaltool'
          displayName: 'Instalar ReportGenerator'

        # Generar reporte consolidado con ReportGenerator
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: |
              $mergedDir = "$(Pipeline.Workspace)\merged-coverage"
              $reportDir = "$(Pipeline.Workspace)\coverage-report"
              
              # Construir lista de archivos de cobertura
              $coverageFiles = @()
              if (Test-Path "$mergedDir\frontend-cobertura.xml") {
                $coverageFiles += "$mergedDir\frontend-cobertura.xml"
              }
              if (Test-Path "$mergedDir\backend-cobertura.xml") {
                $coverageFiles += "$mergedDir\backend-cobertura.xml"
              }
              
              if ($coverageFiles.Count -gt 0) {
                $filesParam = $coverageFiles -join ";"
                Write-Host "Generando reporte consolidado con archivos: $filesParam"
                
                reportgenerator `
                  "-reports:$filesParam" `
                  "-targetdir:$reportDir" `
                  "-reporttypes:Cobertura;HtmlInline_AzurePipelines" `
                  "-sourcedirs:$(System.DefaultWorkingDirectory)"
                
                Write-Host "✅ Reporte consolidado generado"
              } else {
                Write-Host "##[warning]No se encontraron archivos de cobertura para consolidar"
              }
          displayName: 'Generar reporte consolidado (ReportGenerator)'
          condition: always()

        # Publicar cobertura consolidada (Frontend + Backend)
        - task: PublishCodeCoverageResults@2
          inputs:
            codeCoverageTool: 'Cobertura'
            summaryFileLocation: '$(Pipeline.Workspace)/coverage-report/Cobertura.xml'
            reportDirectory: '$(Pipeline.Workspace)/coverage-report'
            failIfCoverageEmpty: false
          condition: always()
          displayName: 'Publicar Code Coverage Consolidado (FE + BE)'
          continueOnError: true


# =======================================
# 🧱 BUILD
# =======================================
- stage: Build
  displayName: 'Build Backend + Frontend'
  dependsOn: Tests
  condition: succeeded()
  jobs:
    - job: BuildJob
      steps:
        - checkout: self

        # ---- Setup Node.js ----
        - task: NodeTool@0
          displayName: 'Setup Node.js'
          inputs:
            versionSpec: '$(nodeVersion)'

        # ---- Setup .NET ----
        - task: UseDotNet@2
          inputs:
            packageType: 'sdk'
            version: '8.0.x'

        # ---- Frontend (Angular) ----
        - task: Npm@1
          displayName: 'npm install (frontend)'
          inputs:
            command: 'install'
            workingDir: 'EmployeeCrudAngular'
            
        - task: PowerShell@2
          displayName: 'Replace tokens in environment files'
          inputs:
            targetType: 'inline'
            workingDirectory: 'EmployeeCrudAngular/src/environments'
            script: |
              # Reemplazar en environment.qa.ts
              $qaFile = 'environment.qa.ts'
              Write-Host "📄 Original QA file:"
              Get-Content $qaFile
              $qaContent = Get-Content $qaFile -Raw
              $qaContent = $qaContent -replace '\$\(WEBAPP_QA_BACKEND_URL\)', '$(WEBAPP_QA_BACKEND_URL)'
              Set-Content $qaFile -Value $qaContent
              Write-Host "✅ Modified QA file:"
              Get-Content $qaFile
              
              # Reemplazar en environment.prod.ts
              $prodFile = 'environment.prod.ts'
              Write-Host "📄 Original PROD file:"
              Get-Content $prodFile
              $prodContent = Get-Content $prodFile -Raw
              $prodContent = $prodContent -replace '\$\(WEBAPP_PROD_BACKEND_URL\)', '$(WEBAPP_PROD_BACKEND_URL)'
              Set-Content $prodFile -Value $prodContent
              Write-Host "✅ Modified PROD file:"
              Get-Content $prodFile
              
              Write-Host "✅ Tokens replaced successfully"

        - task: Npm@1
          displayName: 'npm run build:qa (frontend QA)'
          inputs:
            command: 'custom'
            workingDir: 'EmployeeCrudAngular'
            customCommand: 'run build:qa -- --output-path=dist/qa-build'

        - task: Npm@1
          displayName: 'npm run build:prod (frontend PROD)'
          inputs:
            command: 'custom'
            workingDir: 'EmployeeCrudAngular'
            customCommand: 'run build:prod -- --output-path=dist/prod-build'

        # ---- Backend (.NET) ----
        - task: DotNetCoreCLI@2
          displayName: 'dotnet publish (backend)'
          inputs:
            command: 'publish'
            projects: 'EmployeeCrudApi/EmployeeCrudApi/EmployeeCrudApi.csproj'
            arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/backend'
            zipAfterPublish: true

        # ---- Prepare publish folder ----
        - task: CopyFiles@2
          displayName: 'Copy frontend QA dist to publish'
          inputs:
            SourceFolder: 'EmployeeCrudAngular/dist/qa-build/browser'
            Contents: '**/*'
            TargetFolder: '$(Build.ArtifactStagingDirectory)/frontend-qa'

        - task: CopyFiles@2
          displayName: 'Copy frontend PROD dist to publish'
          inputs:
            SourceFolder: 'EmployeeCrudAngular/dist/prod-build/browser'
            Contents: '**/*'
            TargetFolder: '$(Build.ArtifactStagingDirectory)/frontend-prod'

        - task: PublishBuildArtifacts@1
          displayName: 'Publish Build Artifacts'
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)'
            ArtifactName: 'drop'

# =======================================
# 🌐 DEPLOY QA
# =======================================
- stage: Deploy_QA
  displayName: 'Deploy to QA'
  dependsOn: Build
  condition: succeeded()
  jobs:
    - deployment: DeployQA
      displayName: 'Deploy QA'
      environment: 'QA'
      strategy:
        runOnce:
          deploy:
            steps:
              - download: current
                artifact: drop
              - task: AzureAppServiceSettings@1
                displayName: 'App Settings (QA)'
                inputs:
                  azureSubscription: '$(azureSubscription)'
                  appName: '$(WEBAPP_QA_BACKEND)'
                  appSettings: |
                    [
                      {
                        "name": "MongoDB__ConnectionString",
                        "value": "$(MONGO_URI)",
                        "slotSetting": false
                      },
                      {
                        "name": "MongoDB__DatabaseName",
                        "value": "TP8_db_qa",
                        "slotSetting": false
                      },
                      {
                        "name": "MongoDB__CollectionName",
                        "value": "TP8_animals",
                        "slotSetting": false
                      },
                      {
                        "name": "ASPNETCORE_ENVIRONMENT",
                        "value": "QA",
                        "slotSetting": false
                      }
                    ]
              - task: AzureWebApp@1
                displayName: 'Deploy Backend to $(WEBAPP_QA_BACKEND)'
                inputs:
                  azureSubscription: '$(azureSubscription)'
                  appType: 'webApp'
                  appName: '$(WEBAPP_QA_BACKEND)'
                  package: '$(Pipeline.Workspace)/drop/backend/*.zip'

              - task: AzureWebApp@1
                displayName: 'Deploy Frontend to $(WEBAPP_QA_FRONTEND)'
                inputs:
                  azureSubscription: '$(azureSubscription)'
                  appType: 'webApp'
                  appName: '$(WEBAPP_QA_FRONTEND)'
                  package: '$(Pipeline.Workspace)/drop/frontend-qa'

# =======================================
# 🚀 DEPLOY PROD
# =======================================
- stage: Deploy_PROD
  displayName: 'Deploy to Production'
  dependsOn: Deploy_QA
  condition: succeeded()
  jobs:
    - deployment: DeployPROD
      displayName: 'Deploy PROD'
      environment: 'PROD'
      strategy:
        runOnce:
          deploy:
            steps:
              - download: current
                artifact: drop
              - task: AzureAppServiceSettings@1
                displayName: 'App Settings (PROD)'
                inputs:
                  azureSubscription: '$(azureSubscription)'
                  appName: '$(WEBAPP_PROD_BACKEND)'
                  appSettings: |
                    [
                      {
                        "name": "MongoDB__ConnectionString",
                        "value": "$(MONGO_URI)",
                        "slotSetting": false
                      },
                      {
                        "name": "MongoDB__DatabaseName",
                        "value": "TP8_db_prod",
                        "slotSetting": false
                      },
                      {
                        "name": "MongoDB__CollectionName",
                        "value": "TP8_animals",
                        "slotSetting": false
                      },
                      {
                        "name": "ASPNETCORE_ENVIRONMENT",
                        "value": "Production",
                        "slotSetting": false
                      }
                    ]
              - task: AzureWebApp@1
                displayName: 'Deploy Backend to $(WEBAPP_PROD_BACKEND)'
                inputs:
                  azureSubscription: '$(azureSubscription)'
                  appType: 'webApp'
                  appName: '$(WEBAPP_PROD_BACKEND)'
                  package: '$(Pipeline.Workspace)/drop/backend/*.zip'

              - task: AzureWebApp@1
                displayName: 'Deploy Frontend to $(WEBAPP_PROD_FRONTEND)'
                inputs:
                  azureSubscription: '$(azureSubscription)'
                  appType: 'webApp'
                  appName: '$(WEBAPP_PROD_FRONTEND)'
                  package: '$(Pipeline.Workspace)/drop/frontend-prod'
