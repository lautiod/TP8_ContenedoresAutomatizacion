name: ci

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # necesario para subir a GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_BACK: ${{ github.repository_owner }}/tp8-crud-api
  IMAGE_FRONT: ${{ github.repository_owner }}/tp8-crud-angular

jobs:
  tests_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- Backend (.NET) ----------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend
        run: dotnet restore EmployeeCrudApi/EmployeeCrudApi.csproj

      - name: Build backend
        run: dotnet build EmployeeCrudApi/EmployeeCrudApi.csproj -c Release --no-restore

      - name: Test backend (si hay tests)
        run: |
          if ls **/*Tests.csproj >/dev/null 2>&1; then
            dotnet test -c Release --no-build
          else
            echo "No se encontraron proyectos de test .NET"
          fi

      # ---------- Frontend (Angular) ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (frontend)
        working-directory: EmployeeCrudAngular
        run: npm ci || npm install

      - name: Build frontend
        working-directory: EmployeeCrudAngular
        run: npm run build --if-present || npx ng build --configuration production

  push_images:
    needs: tests_build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (backend)
        id: meta_back
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BACK }}
          tags: |
            type=sha
            type=raw,value=qa
            type=raw,value=prod

      - name: Build & Push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: EmployeeCrudApi/Dockerfile
          push: true
          tags: ${{ steps.meta_back.outputs.tags }}
          labels: ${{ steps.meta_back.outputs.labels }}

      - name: Docker metadata (frontend)
        id: meta_front
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONT }}
          tags: |
            type=sha
            type=raw,value=qa
            type=raw,value=prod

      - name: Build & Push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: EmployeeCrudAngular/Dockerfile
          push: true
          tags: ${{ steps.meta_front.outputs.tags }}
          labels: ${{ steps.meta_front.outputs.labels }}

  deploy_qa:
    needs: push_images
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend QA to Render
        run: curl -X POST "${{ secrets.RENDER_BACK_QA_HOOK }}"
      
      - name: Deploy Frontend QA to Render
        run: curl -X POST "${{ secrets.RENDER_FRONT_QA_HOOK }}"

  deploy_prod:
    needs: deploy_qa
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Deploy Backend PROD to Render
        run: curl -X POST "${{ secrets.RENDER_BACK_PROD_HOOK }}"
      
      - name: Deploy Frontend PROD to Render
        run: curl -X POST "${{ secrets.RENDER_FRONT_PROD_HOOK }}"
