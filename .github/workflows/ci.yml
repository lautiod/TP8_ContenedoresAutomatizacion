name: CI/CD

on:
  push:
    branches: [ "main" ]     # Dispara QA
    tags:     [ "v*" ]       # Dispara PROD
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write   # necesario para publicar en GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}   # ghcr.io/<owner>/<repo>
  FRONT_CONTEXT: ./EmployeeCrudAngular
  BACK_CONTEXT:  ./EmployeeCrudApi
  BACK_PROJECT:  EmployeeCrudApi/EmployeeCrudApi.csproj

jobs:
  test_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node/Angular
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install FE deps
        working-directory: ${{ env.FRONT_CONTEXT }}
        run: npm install
      - name: FE build (prod)
        working-directory: ${{ env.FRONT_CONTEXT }}
        run: npm run build --if-present || npx ng build --configuration production

      # .NET
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore & Test BE
        run: |
          dotnet restore ${{ env.BACK_PROJECT }}
          # Si tenés tests, ejecutalos. Si no, dejá este step con '|| true' o elimínalo.
          dotnet test || true
      - name: Publish BE
        run: dotnet publish ${{ env.BACK_PROJECT }} -c Release -o /tmp/publish /p:UseAppHost=false

  build_and_push:
    needs: test_build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Login a GHCR con el GITHUB_TOKEN
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tags by ref
        id: tags
        run: |
          SHA="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # PROD
            echo "ENV_TAG=prod" >> $GITHUB_OUTPUT
            echo "SUFFIX=${SHA}" >> $GITHUB_OUTPUT
          else
            # QA
            echo "ENV_TAG=qa" >> $GITHUB_OUTPUT
            echo "SUFFIX=${SHA}" >> $GITHUB_OUTPUT
          fi

      # FRONT image
      - name: Build & Push FRONT
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.FRONT_CONTEXT }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/front:${{ steps.tags.outputs.ENV_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/front:${{ steps.tags.outputs.ENV_TAG }}-${{ steps.tags.outputs.SUFFIX }}

      # BACK image
      - name: Build & Push BACK
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.BACK_CONTEXT }}/EmployeeCrudApi/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/back:${{ steps.tags.outputs.ENV_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/back:${{ steps.tags.outputs.ENV_TAG }}-${{ steps.tags.outputs.SUFFIX }}

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Decide env & call Render hooks
        env:
          FRONT_QA:  ${{ secrets.RENDER_FRONT_QA_HOOK }}
          BACK_QA:   ${{ secrets.RENDER_BACK_QA_HOOK }}
          FRONT_PRD: ${{ secrets.RENDER_FRONT_PROD_HOOK }}
          BACK_PRD:  ${{ secrets.RENDER_BACK_PROD_HOOK }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "Deploying to PROD..."
            curl -fsSL -X POST "$FRONT_PRD"
            curl -fsSL -X POST "$BACK_PRD"
          else
            echo "Deploying to QA..."
            curl -fsSL -X POST "$FRONT_QA"
            curl -fsSL -X POST "$BACK_QA"
          fi
