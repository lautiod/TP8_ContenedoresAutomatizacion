name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # necesario para subir a GHCR
  checks: write    # necesario para publicar test results

env:
  REGISTRY: ghcr.io
  IMAGE_BACK: ${{ github.repository_owner }}/tp8-api
  IMAGE_FRONT: ${{ github.repository_owner }}/tp8-angular
  SONAR_PROJECT_KEY: lautiod_TP8_ContenedoresAutomatizacion
  SONAR_ORGANIZATION: lautiod

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      # ---------- Backend Setup & Tests ----------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend
        run: dotnet restore Backend/Backend/EmployeeCrudApi.csproj

      - name: Restore tests
        run: dotnet restore Backend.Tests/EmployeeCrudApi.Tests.csproj

      - name: Test backend with coverage
        run: dotnet test Backend.Tests/EmployeeCrudApi.Tests.csproj -c Release --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Publish Backend Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/test-results.trx'
          check_name: 'Backend Test Results'

      # ---------- Frontend Setup & Tests ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci || npm install

      - name: Test frontend with coverage
        working-directory: Frontend
        run: npx ng test --no-watch --no-progress --browsers ChromeHeadless --code-coverage --karma-config karma.conf.js

      - name: Publish Frontend Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: 'Frontend/test-results/test-results.xml'
          check_name: 'Frontend Test Results'

      # ---------- SonarCloud Analysis ----------
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.sources=Backend/Backend,Frontend/src
            -Dsonar.tests=Backend.Tests
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/bin/**,**/obj/**
            -Dsonar.test.exclusions=**/*.spec.ts
            -Dsonar.javascript.lcov.reportPaths=Frontend/coverage/**/lcov.info
            -Dsonar.typescript.lcov.reportPaths=Frontend/coverage/**/lcov.info
            -Dsonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
            -Dsonar.coverage.exclusions=**/Program.cs,**/*.spec.ts

      - name: Wait for Quality Gate
        run: |
          echo "Waiting for SonarCloud to process the analysis..."
          sleep 10

      - name: Check Quality Gate (Informative)
        continue-on-error: true
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        with:
          scanMetadataReportFile: .sonarqube/out/.sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      
      - name: SonarCloud Results
        run: |
          echo "📊 SonarCloud analysis complete!"
          echo "🔍 View detailed results at: https://sonarcloud.io/dashboard?id=lautiod_TP8_ContenedoresAutomatizacion"
          echo "⚠️  Note: Quality Gate failures are informative only and won't block the pipeline"
          echo "### 📊 SonarCloud Analysis" >> $GITHUB_STEP_SUMMARY
          echo "[View Full Report](https://sonarcloud.io/summary/overall?id=lautiod_TP8_ContenedoresAutomatizacion&branch=main)" >> $GITHUB_STEP_SUMMARY

  build:
    name: Build Validation
    needs: sonarcloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- Backend Build ----------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend
        run: dotnet restore Backend/Backend/EmployeeCrudApi.csproj

      - name: Build backend
        run: dotnet build Backend/Backend/EmployeeCrudApi.csproj -c Release --no-restore

      # ---------- Frontend Build ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci || npm install

      - name: Build frontend (QA)
        working-directory: Frontend
        run: npx ng build --configuration qa

      - name: Build frontend (Production)
        working-directory: Frontend
        run: npx ng build --configuration production

  build_push_qa:
    name: Build & Push QA Images
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend QA
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_BACK }}:qa
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build & Push Frontend QA
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Frontend/Dockerfile.qa
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONT }}:qa
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}

  build_push_prod:
    name: Build & Push Production Images
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend PROD
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_BACK }}:prod
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build & Push Frontend PROD
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Frontend/Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONT }}:prod
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy_qa:
    name: Deploy to QA
    needs: build_push_qa
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend QA to Render
        run: |
          echo "Deploying backend to QA..."
          curl -fsSL -X POST "${{ secrets.RENDER_BACK_QA_HOOK }}"
      
      - name: Deploy Frontend QA to Render
        run: |
          echo "Deploying frontend to QA..."
          curl -fsSL -X POST "${{ secrets.RENDER_FRONT_QA_HOOK }}"
      
      - name: QA Deployment Complete
        run: |
          echo "✅ QA deployment triggered successfully"
          echo "### 🚀 QA Deployment" >> $GITHUB_STEP_SUMMARY
          echo "[View QA Frontend](https://tp8-front-qa.onrender.com/)" >> $GITHUB_STEP_SUMMARY

  deploy_prod:
    name: Deploy to Production
    needs: [build_push_prod]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://tp8-front-prod.onrender.com
    steps:
      - name: Deploy Backend PROD to Render
        run: |
          echo "Deploying backend to Production..."
          curl -fsSL -X POST "${{ secrets.RENDER_BACK_PROD_HOOK }}"
      
      - name: Deploy Frontend PROD to Render
        run: |
          echo "Deploying frontend to Production..."
          curl -fsSL -X POST "${{ secrets.RENDER_FRONT_PROD_HOOK }}"
      
      - name: Production Deployment Complete
        run: echo "✅ Production deployment triggered successfully"

